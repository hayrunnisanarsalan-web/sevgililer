<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sevgililer Günü 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff2e63, #ff8fab);
    overflow: hidden;
}

/* Parlama efekti */
.parlama {
    position: fixed;
    width: 100%;
    height: 100%;
    background: white;
    opacity: 0;
    pointer-events: none;
}

/* Ortadaki kutu */
.kutu {
    background: rgba(255, 255, 255, 0.92);
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    max-width: 350px;
    z-index: 10;
}

h2 {
    color: #c9184a;
    font-size: 22px;
}

button {
    padding: 10px 20px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.3s;
}

#evet {
    background-color: #ff2e63;
    color: white;
}

#hayir {
    position: absolute;
    background-color: white;
    color: #c9184a;
    border: 2px solid #ff2e63;
}

#mesaj {
    margin-top: 20px;
    font-size: 20px;
    color: #d00050;
    font-weight: bold;
}

/* Yağmur efekti */
.sembol {
    position: absolute;
    font-size: 22px;
    animation: yukari 6s linear infinite;
    opacity: 0.8;
}

@keyframes yukari {
    from { transform: translateY(100vh); }
    to { transform: translateY(-100px); }
}
</style>
</head>

<body>

<div class="parlama" id="parlama"></div>

<div class="kutu">
    <h2>Diğer yılda benimle Sevgililer Günü'nü kutlar mısın? 💘</h2>

    <button id="evet" onclick="evetTiklandi()">Evet 💖</button>
    <button id="hayir" onclick="hayirKac()">Hayır 😅</button>

    <div id="mesaj"></div>
</div>

<script>

let evetBoyut = 18;
let hayirBoyut = 18;

function evetTiklandi() {

    document.getElementById("mesaj").innerHTML =
    "Artık her Sevgililer Günü birlikteee 💍💕";

    ekranParla();
    konfeti();
    sesCal();
}

function hayirKac() {

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    let btn = document.getElementById("hayir");
    btn.style.left = x + "px";
    btn.style.top = y + "px";

    hayirBoyut -= 2;
    if(hayirBoyut > 8){
        btn.style.fontSize = hayirBoyut + "px";
    }

    evetBoyut += 2;
    document.getElementById("evet").style.fontSize = evetBoyut + "px";
}

/* Arka plan yağmur */
function sembolOlustur() {
    const semboller = ["🌸","🌹","💖","✨","💘"];
    let s = document.createElement("div");
    s.className = "sembol";
    s.innerHTML = semboller[Math.floor(Math.random()*semboller.length)];
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.animationDuration = (4 + Math.random()*4) + "s";
    document.body.appendChild(s);

    setTimeout(() => {
        s.remove();
    },8000);
}
setInterval(sembolOlustur, 700);

/* Parlama */
function ekranParla(){
    let p = document.getElementById("parlama");
    p.style.opacity = "0.8";
    setTimeout(()=>{
        p.style.opacity = "0";
    },300);
}

/* Konfeti */
function konfeti(){
    for(let i=0;i<20;i++){
        let k = document.createElement("div");
        k.innerHTML = "💖";
        k.style.position = "absolute";
        k.style.left = Math.random()*window.innerWidth + "px";
        k.style.top = Math.random()*window.innerHeight + "px";
        k.style.fontSize = "24px";
        document.body.appendChild(k);

        setTimeout(()=>{k.remove();},2000);
    }
}

/* Mini ses efekti */
function sesCal(){
    let audio = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");
    audio.play();
}

</script>

</body>
  </html>
