<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MUKEMMEL SORU</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
    overflow: hidden;
}

.container {
    background: white;
    padding: 50px;
    border-radius: 30px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    position: relative;
}

h1 {
    margin-bottom: 40px;
}

button {
    padding: 15px 35px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yesBtn {
    background: #4CAF50;
    color: white;
}

#noBtn {
    background: #ff4d6d;
    color: white;
    position: absolute;
}

.floating-text {
    position: absolute;
    font-weight: bold;
    color: white;
    animation: floatUp 2s linear forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translateY(0);
        opacity: 1;
    }
    100% {
        transform: translateY(-200px);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>sen mal misin?🤗</h1></h1>
    <button id="yesBtn">Evet</button>
    <button id="noBtn">Hayır</button>
</div>

<script>
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("click", function() {

    // Butonu rastgele yere kaçır
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";

    // Havadan yazı çıkar
    const text = document.createElement("div");
    text.classList.add("floating-text");
    text.innerText = "He he kesin 😏";

    text.style.left = x + "px";
    text.style.top = y + "px";

    document.body.appendChild(text);

    setTimeout(() => {
        text.remove();
    }, 2000);
});

document.getElementById("yesBtn").addEventListener("click", function() {
    alert("Biliyordummm 😌");
});
</script>

</body>
</html>
