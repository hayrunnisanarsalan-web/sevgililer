<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sevgililer Günü 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
    text-align: center;
}

/* Kalpler */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(1); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}

h1 {
    font-size: 40px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
}

p {
    font-size: 20px;
    max-width: 600px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yesBtn {
    background: white;
    color: #ff4e8b;
}

#noBtn {
    background: #ff4e8b;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<h1>💖 Sevgililer Günümüz Kutlu Olsun 💖</h1>

<p>
Sen hayatıma gelen en güzel mucizesin.  
Kalbimin en tatlı köşesinde hep sen varsın.  
Her gülüşün dünyamı aydınlatıyor,    
Seni her şeyden çok seviyorum😽
  iyikiii varsinnn🩷
</p>

<h2>Benimle sonsuza kadar olur musun? 💍</h2>

<button id="yesBtn" onclick="alert('Ben de seni çok seviyorum ❤️')">Evet 💕</button>
<button id="noBtn">Hayır 💔</button>

<audio autoplay loop>
    <source src="seviyorum_seni_yar.mp3" type="audio/mpeg">
</audio>

<script>
// Kaçan Hayır Butonu
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Kalp oluşturma
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
