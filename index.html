  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sevgililer Günü</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #1a0026, #3d003d, #660033);
    overflow: hidden;
}

/* Yumuşak ışık efekti */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at center, rgba(255,0,100,0.2), transparent 60%);
    animation: glow 6s infinite alternate;
}

@keyframes glow {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

.container {
    position: relative;
    text-align: center;
    padding: 60px;
    border-radius: 30px;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 50px rgba(255, 0, 120, 0.6);
    border: 2px solid rgba(255,255,255,0.2);
}

h1 {
    color: white;
    font-size: 42px;
    letter-spacing: 2px;
    margin-bottom: 40px;
}

button {
    padding: 15px 45px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff0066, #ff4da6);
    color: white;
    transition: 0.4s;
}

button:hover {
    transform: scale(1.1);
    box-shadow: 0 0 25px #ff1a75;
}

.hidden-message {
    margin-top: 30px;
    font-size: 22px;
    color: #ffd6f0;
    opacity: 0;
    transition: opacity 1.5s ease;
}

.show {
    opacity: 1;
}
</style>
</head>

<body>

<div class="container">
    <h1>Benimle sonsuza kadar olur musun?</h1>
    <button onclick="showMessage()">Evet</button>
    <div class="hidden-message" id="loveText">
        Sen hayatımın en güzel tesadüfüsün...  
        Kalbimin attığı her yerde sen varsın.
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("loveText").classList.add("show");
}
</script>

</body>
</html>
