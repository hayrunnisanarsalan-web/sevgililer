<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sevgililer Günü 💖</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    overflow: hidden;
    color: white;
    text-align: center;
}

/* Yazı Kutusu */
.container {
    background: rgba(255,255,255,0.15);
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
}

/* Kalpler */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    animation: float 6s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(1); opacity: 1; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}

h1 {
    font-size: 38px;
}

p {
    font-size: 20px;
    max-width: 600px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

#yesBtn {
    background: white;
    color: #ff4e8b;
}

#noBtn {
    background: #ff4e8b;
    color: white;
    position: absolute;
}
iframe {
    display: none;
}
</style>
</head>

<body>

<div class="container">
<h1>🐥😽 Sevgililer Günümüz Kutlu Olsun ayimmm🐻</h1>

<p>
Sen hayatımın en güzel tesadüfü,  
kalbimin en huzurlu yerisin.  
Gülüşün bahar gibi,  
Bu Sevgililer Günü'nde bir kez daha söylüyorum;  
iyi ki varsın, iyi ki benimlesin 🩷
veee ennn onemlisiii seni çoookk seviyorumm 😽
</p>

<h2>Benimle sonsuza kadar olur musun? 💍</h2>

<button id="yesBtn" onclick="romantikMesaj()">Evet 💕</button>
<button id="noBtn">Hayır 💔</button>
</div>

<!-- YouTube müzik -->
<iframe 
src="https://www.youtube.com/embed/1jZzP6Zxw5c?autoplay=1&loop=1&playlist=1jZzP6Zxw5c"
allow="autoplay">
</iframe>

<script>
// Kaçan Hayır Butonu
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// Kalp oluşturma
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);

// Evet Butonu Mesajı
function romantikMesaj(){
    document.body.innerHTML = `
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#ff758c,#ff7eb3);color:white;font-family:Georgia;text-align:center;flex-direction:column;">
        <h1>💍 Sonsuza Kadar 💖</h1>
        <p style="font-size:22px;max-width:600px;">
        Kalbim artık sadece seninle atıyor.  
        Hayatımın en güzel hikayesini seninle yazmak istiyorum.  
        Her Sevgililer Günümüz böyle sevgi dolu olsun…  
        Seni her şeyden çok seviyorum ❤️
        </p>
    </div>
    `;
}
</script>

</body>
</html>
